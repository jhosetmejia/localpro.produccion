# Revisión automática en cada envío a staging o master: código PHP válido y todas las plantillas Blade compilan a PHP válido.
# Si falla, GitHub avisa por correo y se ve en rojo en el repositorio.
name: Revisión antes de publicar

on:
  push:
    branches: [master, staging]
  pull_request:

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, intl, zip, pdo_sqlite, bcmath
          coverage: none

      - name: Código PHP válido
        run: |
          fallas=0
          for f in $(git ls-files '*.php' | grep -v '^vendor/'); do
            php -l "$f" > /dev/null || { echo "Error en $f"; fallas=1; }
          done
          exit $fallas

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Entorno de prueba
        run: |
          printf "APP_NAME=LocalProo\nAPP_ENV=testing\nAPP_KEY=\nAPP_DEBUG=true\nAPP_URL=https://localproo.com\nDB_CONNECTION=sqlite\nDB_DATABASE=$(pwd)/database/ci.sqlite\nCACHE_DRIVER=array\nCACHE_STORE=array\nSESSION_DRIVER=array\nQUEUE_CONNECTION=sync\nMAIL_MAILER=array\n" > .env
          touch database/ci.sqlite
          php artisan key:generate --force
          composer dump-autoload -o --no-scripts
          php artisan package:discover

      - name: Plantillas Blade compilan a PHP válido
        run: |
          php artisan view:clear
          if ! php artisan view:cache > vc.txt 2>&1; then
            echo "::error title=view:cache falló::$(tail -c 900 vc.txt | tr '\n' ' ')"
            exit 1
          fi
          fallas=0
          for f in storage/framework/views/*.php; do
            if ! salida=$(php -l "$f" 2>&1); then
              origen=$(grep -o 'PATH [^*]*' "$f" | head -1)
              echo "::error title=Plantilla con error::${origen} -> $(echo "$salida" | tr '\n' ' ' | head -c 400)"
              fallas=1
            fi
          done
          exit $fallas

      - name: Rutas cargan
        run: php artisan route:list > /dev/null

      - name: Seguridad - paquetes con fallas conocidas (aviso)
        continue-on-error: true
        run: |
          if ! composer audit --no-dev --format=plain > audit.txt 2>&1; then
            echo "::warning title=Paquetes con fallas de seguridad::$(head -c 900 audit.txt | tr '\n' ' ')"
          fi
          cat audit.txt

      - name: Seguridad - nada de claves ni archivos peligrosos en el repositorio
        run: |
          fallas=0
          if git ls-files | grep -E '(^|/)\.env$|\.sql(\.gz)?$|id_rsa|\.pem$|\.key$' ; then echo "::error title=Archivo sensible en el repo::Hay .env, .sql o llaves en el repositorio"; fallas=1; fi
          if git ls-files 'public/*' | grep -iE '\.(php[0-9]?|phtml|phar)$' | grep -vE '^public/index\.php$' ; then echo "::error title=PHP en public::Solo public/index.php puede ser PHP"; fallas=1; fi
          if git grep -nE "(sk_live_[A-Za-z0-9]{10,}|pub_prod_[A-Za-z0-9]{10,}|prv_prod_[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY)" -- ':!*.md' ':!.github/*' ; then echo "::error title=Clave en el código::Hay una clave escrita en el código"; fallas=1; fi
          if git grep -nE "\b(dd|dump|var_dump|phpinfo)\(" -- 'app/*.php' 'routes/*.php' | grep -v '//' ; then echo "::error title=Depuración olvidada::Hay dd()/dump()/phpinfo() en el código"; fallas=1; fi
          exit $fallas
